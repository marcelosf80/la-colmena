      <polygon points="178,270 244,308 244,384 178,422 112,384 112,308" opacity="0.5"/>
      <polygon points="334,270 400,308 400,384 334,422 268,384 268,308" opacity="0.5"/>
    </g>
  </g>

  <text x="330" y="145" font-size="80" font-weight="700" fill="#FFFFFF">La Colmena</text>
