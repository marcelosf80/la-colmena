      <stop offset="0" stop-color="#12131C"/>
      <stop offset="1" stop-color="#262A45"/>
    </linearGradient>
    <linearGradient id="miel2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB300"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#fondo)"/>

  <!-- Celdas hexagonales decorativas -->
  <g fill="#FFB300" opacity="0.10">
    <polygon points="1050,60 1110,94 1110,162 1050,196 990,162 990,94"/>
    <polygon points="1160,140 1220,174 1220,242 1160,276 1100,242 1100,174"/>
    <polygon points="1200,20 1260,54 1260,122 1200,156 1140,122 1140,54"/>
    <polygon points="940,200 1000,234 1000,302 940,336 880,302 880,234"/>
  </g>

  <!-- Logo -->
  <g transform="translate(90,72) scale(0.55)">
    <polygon points="256,16 471,138 471,374 256,496 41,374 41,138" fill="#1A1B26" stroke="#FFB300" stroke-width="16"/>
    <g fill="url(#miel2)">
