  <g fill="#8D97B5" font-size="21" font-weight="600">
    <text x="336" y="256">Nodo en Rust</text>
    <text x="480" y="256">·</text>
    <text x="500" y="256">Coordinador FastAPI</text>
    <text x="696" y="256">·</text>
    <text x="716" y="256">Protobuf v1</text>
    <text x="832" y="256">·</text>
