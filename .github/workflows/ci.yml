name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coordinador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinador
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: comunidad_ia
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comunidad_ia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comunidad_ia -d comunidad_ia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      COMUNIDAD_IA_BD_URL: postgresql://comunidad_ia:postgres@localhost:5432/comunidad_ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coordinador/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests unitarios y de API
        run: python -m pytest tests/unitarios -v
      - name: Tests de integración Postgres
        run: python -m pytest tests/integraciones -v

  nodo-escritorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodo-escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nodo-escritorio
      - run: cargo test --locked
