name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coordinador:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coordinador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: coordinador/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/unitarios -v

  nodo-escritorio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodo-escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nodo-escritorio
      - run: cargo test --locked
