[package]
name = "nodo-escritorio"
version = "0.1.0"
edition = "2021"
description = "Nodo de cómputo donado para la red La Colmena"

[dependencies]
tokio = { version = "=1.38.0", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
minreq = { version = "2", features = ["json-using-serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "=4.4.18", features = ["derive"] }
sysinfo = "0.30"
rayon = "=1.10.0"
rayon-core = "=1.12.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "nodo-escritorio"
path = "src/main.rs"
