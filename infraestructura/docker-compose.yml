services:
  coordinador:
    build:
      context: ../coordinador
    ports:
      - "8000:8000"
    environment:
      COMUNIDAD_IA_ENTORNO: desarrollo
      COMUNIDAD_IA_BD_URL: postgresql://comunidad_ia:cambiar_en_produccion@postgres:5432/comunidad_ia
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: comunidad_ia
      POSTGRES_PASSWORD: cambiar_en_produccion
      POSTGRES_DB: comunidad_ia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comunidad_ia -d comunidad_ia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
